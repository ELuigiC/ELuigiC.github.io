<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081B33">
<title>ASVA · Mariscos</title>
<style>
  :root{
    --navy:#0E2A4C;
    --navy-deep:#081B33;
    --cream:#F4EDE3;
    --cream-2:#EBE1CF;
    --gold:#C9A24F;
    --gold-light:#E8D08F;
    --ink:#10233F;
    --muted:#6F6656;
    --blue:#1668FF;
    --font:"Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100dvh;
    background:var(--navy-deep) radial-gradient(130% 70% at 50% -5%, #1B4677 0%, var(--navy-deep) 62%);
    color:var(--ink);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center;
    padding:16px 14px calc(18px + env(safe-area-inset-bottom));
  }
  .acrilico{
    position:relative; width:100%; max-width:440px;
    background:var(--cream);
    border-radius:22px;
    box-shadow:inset 0 0 0 1px rgba(201,162,79,.55), 0 26px 60px rgba(0,0,0,.5);
    overflow:hidden;
    padding:0 20px 30px;
  }
  .ola{position:absolute; pointer-events:none; height:auto}
  .ola-top{top:0; right:0; width:52%}
  .ola-bottom{bottom:0; left:0; width:36%; transform:rotate(180deg)}

  .cabecera{position:relative; text-align:center; padding-top:24px}
  .logo{
    width:216px; max-width:70%; height:auto; display:block; margin:0 auto;
    filter:drop-shadow(0 6px 10px rgba(16,35,63,.12));
  }
  h1{
    margin:6px 0 4px; font-size:26px; line-height:1.15; font-weight:800; letter-spacing:-.01em; color:var(--navy);
  }
  .estado{
    margin:0; font-size:14.5px; color:var(--muted); display:inline-flex; align-items:center; gap:8px; white-space:nowrap;
  }
  .estado .punto{width:9px; height:9px; border-radius:50%; background:#B8AE9C; box-shadow:0 0 0 3px rgba(184,174,156,.25)}
  .estado.abierto .punto{background:#2E9E5B; box-shadow:0 0 0 3px rgba(46,158,91,.22)}

  .acciones{
    position:relative; display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
    margin:22px 0 0; padding:0; list-style:none;
  }
  .accion{
    appearance:none; border:0; background:transparent; font:inherit; color:var(--navy);
    display:flex; flex-direction:column; align-items:center; gap:9px;
    padding:6px 4px 8px; border-radius:16px; text-decoration:none; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .accion:active .disco{transform:scale(.94)}
  .accion:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
  .accion[aria-expanded="true"] .disco{background:var(--gold); color:var(--navy); box-shadow:inset 0 0 0 2px var(--navy)}
  .disco{
    width:66px; height:66px; border-radius:50%;
    background:var(--navy); color:var(--cream);
    box-shadow:inset 0 0 0 2.5px var(--gold), 0 6px 14px rgba(14,42,76,.28);
    display:grid; place-items:center;
    transition:transform .12s ease, background .18s ease, color .18s ease;
  }
  .disco svg{width:28px; height:28px}
  .accion .etiqueta{font-size:14px; font-weight:800; letter-spacing:.01em}

  .wifi{
    position:relative; margin:14px 0 0; padding:16px 16px 14px;
    background:var(--cream-2); border-radius:16px;
    box-shadow:inset 0 0 0 1px rgba(201,162,79,.5);
    animation:aparece .22s ease-out;
  }
  .wifi[hidden]{display:none}
  .wifi-fila{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:6px 0}
  .wifi-fila + .wifi-fila{border-top:1px solid rgba(201,162,79,.35)}
  .wifi-fila span{font-size:14px; color:var(--muted)}
  .wifi-fila strong{font-size:17px; font-weight:800; color:var(--navy); text-align:right; word-break:break-all}
  .wifi-fila strong.pass{letter-spacing:.08em; user-select:all; -webkit-user-select:all}
  .copiar{
    appearance:none; width:100%; margin-top:12px; border:0; border-radius:12px;
    background:var(--navy); color:var(--cream); font:inherit; font-size:15px; font-weight:800;
    padding:13px 16px; cursor:pointer; -webkit-tap-highlight-color:transparent;
    transition:background .18s ease;
  }
  .copiar:active{background:#0A1E38}
  .copiar:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
  .copiar.listo{background:#2E9E5B}
  .ayuda{margin:10px 0 0; font-size:13px; color:var(--muted); text-align:center}

  .datos{
    position:relative; list-style:none; margin:22px 0 0; padding:0;
  }
  .datos li + li{border-top:1px solid rgba(201,162,79,.4)}
  .datos a, .datos .fila{
    display:flex; justify-content:space-between; align-items:center; gap:14px;
    padding:14px 2px; color:var(--ink); text-decoration:none;
    -webkit-tap-highlight-color:transparent;
  }
  .datos a:focus-visible{outline:3px solid var(--gold); outline-offset:-3px; border-radius:10px}
  .dato-k{font-size:15px; font-weight:800; color:var(--navy); flex:0 0 auto}
  .dato-v{font-size:14px; color:var(--muted); text-align:right; line-height:1.35}
  .datos a .dato-v::after{content:"›"; margin-left:8px; color:var(--gold); font-weight:800; font-size:18px}

  .pie{
    position:relative; margin-top:34px; display:flex; justify-content:center; align-items:center; gap:7px;
    color:var(--navy); font-size:16px; font-weight:800; letter-spacing:-.01em;
  }
  .pie svg{width:22px; height:22px}
  .pie small{font-weight:500; color:var(--muted); font-size:12px; margin-right:3px}

  @keyframes aparece{from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:none}}
  @keyframes entra{from{opacity:0; transform:translateY(10px) scale(.97)} to{opacity:1; transform:none}}
  .cabecera{animation:entra .55s cubic-bezier(.2,.7,.2,1) both}
  .acciones{animation:entra .55s cubic-bezier(.2,.7,.2,1) .12s both}
  .datos{animation:entra .55s cubic-bezier(.2,.7,.2,1) .2s both}
  @media (prefers-reduced-motion:reduce){
    .cabecera,.acciones,.datos,.wifi{animation:none}
    .disco{transition:none}
  }
</style>
</head>

<script>
  // ——— Datos del negocio: esto es lo único que cambia por cliente ———
  const NEGOCIO = {
    nombre: 'ASVA',
    placeId: 'ChIJMdUkeACxKIQR-tPpxC0D3jo',          // Perfil de Google de ASVA Restaurante
    telefono: '+52 33 3405 7210',
    direccion: 'C. Álvaro Obregón 663, Oblatos',
    wifi: { red: 'ASVA Clientes', pass: 'mariscos2026' },   // ← cambiar por los datos reales
    // Horario por día (0 = domingo … 6 = sábado). null = cerrado. Minutos desde medianoche.
    horario: { 0: null, 1: [720, 1110], 2: [720, 1110], 3: [720, 1110], 4: [720, 1110], 5: [720, 1110], 6: [720, 1110] },
    horarioTexto: 'Lunes a sábado, 12:00 a 6:30 pm<br>Domingo cerrado'
  };

  // Enlaces derivados del perfil de Google
  const q = encodeURIComponent(NEGOCIO.nombre + ' Restaurante');
  document.getElementById('linkMenu').href = 'https://www.google.com/maps/place/?q=place_id:' + NEGOCIO.placeId;
  document.getElementById('linkResena').href = 'https://search.google.com/local/writereview?placeid=' + NEGOCIO.placeId;
  document.getElementById('linkComoLlegar').href = 'https://www.google.com/maps/dir/?api=1&destination=' + q + '&destination_place_id=' + NEGOCIO.placeId;
  document.getElementById('linkLlamar').href = 'tel:' + NEGOCIO.telefono.replace(/[^\d+]/g, '');
  document.getElementById('direccion').textContent = NEGOCIO.direccion;
  document.getElementById('telefono').textContent = NEGOCIO.telefono.replace('+52 ', '');
  document.getElementById('horarioTexto').innerHTML = NEGOCIO.horarioTexto;
  document.getElementById('wifiRed').textContent = NEGOCIO.wifi.red;
  document.getElementById('wifiPass').textContent = NEGOCIO.wifi.pass;

  // Estado abierto / cerrado según la hora del teléfono
  (function estado(){
    const DIAS = ['el domingo','el lunes','el martes','el miércoles','el jueves','el viernes','el sábado'];
    const fmt = m => { let h = Math.floor(m/60), mm = m % 60; const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return h + ':' + String(mm).padStart(2,'0') + ' ' + ap; };
    const now = new Date(), d = now.getDay(), m = now.getHours()*60 + now.getMinutes();
    const hoy = NEGOCIO.horario[d];
    const el = document.getElementById('estado'), txt = document.getElementById('estadoTexto');
    if (hoy && m >= hoy[0] && m < hoy[1]) { el.classList.add('abierto'); txt.textContent = 'Abierto hasta las ' + fmt(hoy[1]); return; }
    if (hoy && m < hoy[0]) { txt.textContent = 'Cerrado, abre hoy a las ' + fmt(hoy[0]); return; }
    for (let i = 1; i <= 7; i++) {
      const nd = (d + i) % 7, h = NEGOCIO.horario[nd];
      if (h) { txt.textContent = 'Cerrado, abre ' + (i === 1 ? 'mañana' : DIAS[nd]) + ' a las ' + fmt(h[0]); return; }
    }
  })();

  // Wi‑Fi: mostrar datos y copiar contraseña
  const btnWifi = document.getElementById('btnWifi'), panel = document.getElementById('wifi');
  btnWifi.addEventListener('click', () => {
    const abierto = btnWifi.getAttribute('aria-expanded') === 'true';
    btnWifi.setAttribute('aria-expanded', String(!abierto));
    panel.hidden = abierto;
    if (!abierto) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });

  async function copiar(texto){
    try { await navigator.clipboard.writeText(texto); return true; } catch (e) {}
    try {
      const ta = document.createElement('textarea'); ta.value = texto; ta.setAttribute('readonly','');
      ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch (e) { return false; }
  }
  const btnCopiar = document.getElementById('btnCopiar');
  btnCopiar.addEventListener('click', async () => {
    const ok = await copiar(NEGOCIO.wifi.pass);
    btnCopiar.textContent = ok ? 'Contraseña copiada' : 'Mantén presionada la contraseña para copiarla';
    btnCopiar.classList.toggle('listo', ok);
    setTimeout(() => { btnCopiar.textContent = 'Copiar contraseña'; btnCopiar.classList.remove('listo'); }, 2500);
  });
</script>
